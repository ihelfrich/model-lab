name: shell
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the front-end dependencies
        run: npm --prefix crates/app/ui ci
      - name: Front-end unit tests
        run: npm --prefix crates/app/ui test -- --run
      - name: Rust tests (every crate but the egui application)
        run: cargo test --workspace --locked --exclude tree-ensemble-lab
      - name: Build the engine job sidecar
        run: python packaging/sidecar.py && python packaging/sidecar.py --check
      - name: Build the Tauri bundle (macOS, build-machine paths remapped)
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=model-lab --remap-path-prefix=/Users/runner/.cargo/registry=cargo-registry
        working-directory: crates/app
        run: ui/node_modules/.bin/tauri build --ci
      - name: Build the Tauri bundle (Windows)
        if: runner.os == 'Windows'
        working-directory: crates/app
        run: ui/node_modules/.bin/tauri build --ci
      - name: Check the macOS bundle carries the sidecar and no developer paths
        if: runner.os == 'macOS'
        run: |
          app="target/release/bundle/macos/Model Lab.app"
          test -f "$app/Contents/MacOS/model-lab-engine-job"
          test -d "$app/Contents/Resources/lessons"
          for bin in "$app/Contents/MacOS/model-lab" "$app/Contents/MacOS/model-lab-engine-job"; do
            if strings "$bin" | grep -q "/Users/ian"; then echo "developer path in $bin"; exit 1; fi
          done
      - name: Check the Windows bundle carries the sidecar and no developer paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/model-lab.exe
          if (-not (Test-Path target/release/model-lab-engine-job.exe)) { throw 'sidecar missing beside the executable' }
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe
          if (-not $nsis) { throw 'no NSIS installer produced' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains('/Users/ian')) { throw 'developer path in model-lab.exe' }
      - uses: actions/upload-artifact@v4
        with:
          name: model-lab-${{ matrix.os }}
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
