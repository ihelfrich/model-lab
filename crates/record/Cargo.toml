[package]
name = "model-lab-record"
version = "0.1.0"
edition = "2021"
description = "Model Lab learner record: attempts, predictions, answers and mastery in a local SQLite file"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
