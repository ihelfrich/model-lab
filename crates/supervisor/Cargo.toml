[package]
name = "model-lab-supervisor"
version = "0.1.0"
edition = "2021"
description = "Model Lab job supervisor: process-tree control, limits, progress protocol, checkpoints, ETA and resource sampling"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
rand = "=0.8.5"
sha2 = "=0.10.9"
